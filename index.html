<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medium &mdash; Human Stories &amp; Ideas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Sora:wght@100..800&display=swap"
        rel="stylesheet"
    >
</head>
<body>

 
    <a href="#main-content" class="skip-link">Skip to main content</a>


    <header role="banner">
        <nav class="navbar" aria-label="Primary navigation">
            <a href="#" class="logo" aria-label="Medium — go to homepage">Medium</a>

            <ul class="nav-links" id="nav-links" role="list">
                <li><a href="#">Our story</a></li>
                <li><a href="#">Membership</a></li>
                <li><a href="#">Write</a></li>
                <li><a href="#">Sign in</a></li>
                <li>
    
                    <a href="#" class="btn-dark" aria-label="Get started — create a free account">Get started</a>
                </li>
            </ul>


            <button
                class="nav-toggle"
                aria-label="Toggle navigation menu"
                aria-expanded="false"
                aria-controls="nav-links"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <hr class="nav-divider">


    <main id="main-content">


        <section class="hero-section" aria-labelledby="hero-heading">
            <div class="hero-container">

                <div class="hero-text">

                    <h1 id="hero-heading">Human<br>stories &amp; ideas</h1>
                    <p>A place to read, write, and deepen your understanding</p>
                    <a href="#" class="btn-large" aria-label="Start reading on Medium">Start reading</a>
                </div>


                <div
                    class="hero-background"
                    role="img"
                    aria-label="Illustration: lotus flower, moon-phase diagram, and a hand writing with a fountain pen"
                ></div>

            </div>
        </section>

    </main>

    <hr class="nav-divider">


    <footer class="footer" aria-label="Site footer">
        <a href="#">Help</a>
        <a href="#">Status</a>
        <a href="#">About</a>
        <a href="#">Careers</a>
        <a href="#">Press</a>
        <a href="#">Blog</a>
        <a href="#">Privacy</a>
        <a href="#">Rules</a>
        <a href="#">Terms</a>
        <a href="#">Text to speech</a>
    </footer>


    <script>
        const toggle   = document.querySelector('.nav-toggle');
        const navLinks = document.querySelector('.nav-links');

        toggle.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('nav-open');
            toggle.setAttribute('aria-expanded', String(isOpen));
        });

    
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('nav-open');
                toggle.setAttribute('aria-expanded', 'false');
            });
        });
    </script>

</body>
</html>
